name: BTScore
options:
  bundleIdPrefix: com.pabloregis
  developmentLanguage: pt-BR
  deploymentTarget:
    watchOS: "26.0"
packages:
  ScoreEngine:
    path: ScoreEngine
targets:
  BTScore:
    type: application
    platform: watchOS
    sources:
      - App
    dependencies:
      - package: ScoreEngine
      - sdk: HealthKit.framework
    # Gerados pelo XcodeGen a partir daqui; não são versionados.
    entitlements:
      path: Generated/BTScore.entitlements
      properties:
        com.apple.developer.healthkit: true
    info:
      path: Generated/Info.plist
      properties:
        WKBackgroundModes:
          - workout-processing
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pabloregis.btscore
        PRODUCT_NAME: BTScore
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: BT Score
        INFOPLIST_KEY_WKApplication: "YES"
        INFOPLIST_KEY_WKWatchOnly: "YES"
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: O BT Score grava cada partida como um treino de tênis no app Saúde e mantém o placar na tela quando você levanta o pulso.
        LOCALIZATION_PREFERS_STRING_CATALOGS: "YES"
        SWIFT_EMIT_LOC_STRINGS: "YES"
schemes:
  BTScore:
    build:
      targets:
        BTScore: all
